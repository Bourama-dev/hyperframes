<!doctype html><html lang="fr"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=1920,height=1080"/>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@700,800,900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet"/>
<script src="../node_modules/gsap/dist/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#fff}
#s02{position:relative;width:1920px;height:1080px;background:#fff;overflow:hidden}
#s2-ghost{position:absolute;right:-40px;top:-120px;font-family:"Satoshi",sans-serif;font-size:700px;line-height:1;color:rgba(233,30,140,.05);pointer-events:none;user-select:none;font-weight:800}
#s2-bar{position:absolute;left:0;top:0;width:8px;height:1080px;background:linear-gradient(180deg,#E91E8C,#06B6D4);transform-origin:top}
#s2-pad{display:flex;flex-direction:column;justify-content:center;width:100%;height:100%;padding:0 220px 0 200px}
#s2-eyebrow{display:inline-flex;align-items:center;gap:7px;background:rgba(233,30,140,.07);border:1px solid rgba(233,30,140,.2);border-radius:100px;padding:6px 16px;width:fit-content;margin-bottom:36px;font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#E91E8C}
.s2-line{font-family:"Satoshi",sans-serif;font-size:92px;line-height:.88;letter-spacing:-.025em;color:#0F172A;font-weight:800}
.s2-line.hl{background:linear-gradient(135deg,#E91E8C,#06B6D4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
#s2-rule{width:400px;height:3px;background:linear-gradient(90deg,#E91E8C,#06B6D4);transform-origin:left;margin:36px 0 28px;border-radius:2px}
#s2-sub{font-family:"Inter",sans-serif;font-weight:300;font-size:22px;color:#64748B;max-width:720px;line-height:1.6}
#vignette{position:absolute;inset:0;pointer-events:none;z-index:90;background:radial-gradient(ellipse at center,transparent 48%,rgba(0,0,0,.1) 100%)}
</style></head><body>
<div id="s02" data-composition-id="s02-problem" data-width="1920" data-height="1080" data-start="0" data-duration="3">
  <div id="s2-ghost">?</div>
  <div id="s2-bar"></div>
  <div id="s2-pad">
    <div id="s2-eyebrow">❓ La réalité d'aujourd'hui</div>
    <div class="s2-line" id="s2-l1">TU NE SAIS PAS</div>
    <div class="s2-line hl" id="s2-l2">QUEL MÉTIER</div>
    <div class="s2-line" id="s2-l3">CHOISIR ?</div>
    <div id="s2-rule"></div>
    <div id="s2-sub">Tu n'es pas seul·e — 3 millions de jeunes font face à la même question chaque année. CléAvenir a la réponse. 🎯</div>
  </div>
  <div id="vignette"></div>
</div>
<script>
window.__timelines = window.__timelines || {};
var tl = gsap.timeline({ paused: true });
gsap.set("#s2-bar", { scaleY:0 });
gsap.set("#s2-eyebrow,#s2-sub", { opacity:0 });
gsap.set("#s2-l1,#s2-l2,#s2-l3", { opacity:0, x:-60 });
gsap.set("#s2-rule", { scaleX:0 });
gsap.set("#s2-sub", { y:12 });

tl.fromTo("#s2-bar", { scaleY:0 }, { scaleY:1, duration:.28, ease:"power3.out" }, 0);
tl.fromTo("#s2-eyebrow", { opacity:0, y:10 }, { opacity:1, y:0, duration:.2, ease:"expo.out" }, .12);
tl.fromTo("#s2-l1", { opacity:0, x:-60 }, { opacity:1, x:0, duration:.18, ease:"power4.out" }, .22);
tl.fromTo("#s2-l2", { opacity:0, x:-60 }, { opacity:1, x:0, duration:.18, ease:"power4.out" }, .32);
tl.fromTo("#s2-l3", { opacity:0, x:-60 }, { opacity:1, x:0, duration:.18, ease:"power4.out" }, .42);
tl.fromTo("#s2-rule", { scaleX:0 }, { scaleX:1, duration:.28, ease:"power2.out" }, .56);
tl.fromTo("#s2-sub", { opacity:0, y:12 }, { opacity:1, y:0, duration:.24, ease:"sine.out" }, .72);
tl.to("#s2-ghost", { y:50, duration:2.5, ease:"none" }, 0);
/* exit */
tl.to("#s02", { opacity:0, duration:.18, ease:"power2.in" }, 2.8);

window.__timelines["s02-problem"] = tl;
</script></body></html>
