<!doctype html><html lang="fr"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=1920,height=1080"/>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@700,800,900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet"/>
<script src="../node_modules/gsap/dist/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:1920px;height:1080px;overflow:hidden;background:#fff}
#s15{position:relative;width:1920px;height:1080px;background:#fff;overflow:hidden}
#s15-ghost{position:absolute;right:-40px;bottom:-80px;font-family:"Satoshi",sans-serif;font-size:420px;line-height:1;color:rgba(233,30,140,.04);pointer-events:none;user-select:none;font-weight:800}
#s15-content{display:flex;flex-direction:column;justify-content:center;align-items:center;width:100%;height:100%;padding:0 120px;gap:44px}
#s15-eyebrow{display:inline-flex;align-items:center;gap:7px;background:rgba(233,30,140,.07);border:1px solid rgba(233,30,140,.18);border-radius:100px;padding:8px 20px;font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:#E91E8C}
#s15-row{display:flex;gap:44px;align-items:flex-start;justify-content:center;width:100%}
.stat-card{display:flex;flex-direction:column;align-items:center;gap:10px;flex:1}
.stat-ico{font-size:54px}
.stat-num{font-family:"Satoshi",sans-serif;font-size:100px;line-height:.85;letter-spacing:-.04em;background:linear-gradient(135deg,#E91E8C,#06B6D4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:800}
.stat-label{font-family:"Inter",sans-serif;font-weight:300;font-size:24px;letter-spacing:.01em;color:#475569;text-align:center}
.stat-sub{font-family:"Space Grotesk",sans-serif;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#E91E8C}
#s15-sep{width:1px;height:150px;background:linear-gradient(180deg,transparent,#E2E8F0,transparent);align-self:center}
#s15-sep2{width:1px;height:150px;background:linear-gradient(180deg,transparent,#E2E8F0,transparent);align-self:center}
#s15-tagline{font-family:"Inter",sans-serif;font-weight:300;font-size:26px;color:#64748B;text-align:center}
#vignette{position:absolute;inset:0;pointer-events:none;z-index:90;background:radial-gradient(ellipse at center,transparent 48%,rgba(0,0,0,.12) 100%)}
</style></head><body>
<div id="s15" data-composition-id="s15-stats" data-width="1920" data-height="1080" data-start="0" data-duration="3.5">
  <div id="s15-ghost">STATS</div>
  <div id="s15-content">
    <div id="s15-eyebrow">📊 CléAvenir en chiffres</div>
    <div id="s15-row">
      <div class="stat-card" id="s15-s1"><div class="stat-ico">👥</div><div class="stat-num">10K+</div><div class="stat-label">utilisateurs actifs</div><div class="stat-sub">et ça grandit 🚀</div></div>
      <div id="s15-sep"></div>
      <div class="stat-card" id="s15-s2"><div class="stat-ico">💼</div><div class="stat-num">50K+</div><div class="stat-label">métiers analysés</div><div class="stat-sub">mis à jour chaque semaine</div></div>
      <div id="s15-sep2"></div>
      <div class="stat-card" id="s15-s3"><div class="stat-ico">⭐</div><div class="stat-num">95%</div><div class="stat-label">taux de satisfaction</div><div class="stat-sub">nos utilisateurs adorent ❤️</div></div>
    </div>
    <div id="s15-tagline">Simple · Rapide · Gratuit · Propulsé par l'IA ✨</div>
  </div>
  <div id="vignette"></div>
</div>
<script>
window.__timelines = window.__timelines || {};
var tl = gsap.timeline({ paused: true });
gsap.set("#s15-eyebrow,#s15-tagline", { opacity:0, y:16 });
gsap.set("#s15-s1,#s15-s2,#s15-s3", { opacity:0, y:28 });
gsap.set("#s15-sep,#s15-sep2", { opacity:0 });

tl.fromTo("#s15-eyebrow", { opacity:0, y:16 }, { opacity:1, y:0, duration:.22, ease:"expo.out" }, 0);
tl.fromTo("#s15-sep,#s15-sep2", { opacity:0 }, { opacity:1, duration:.24 }, .18);
tl.fromTo("#s15-s1", { opacity:0, y:28 }, { opacity:1, y:0, duration:.28, ease:"power3.out" }, .18);
tl.fromTo("#s15-s2", { opacity:0, y:28 }, { opacity:1, y:0, duration:.28, ease:"power3.out" }, .3);
tl.fromTo("#s15-s3", { opacity:0, y:28 }, { opacity:1, y:0, duration:.28, ease:"power3.out" }, .42);
tl.fromTo("#s15-tagline", { opacity:0, y:16 }, { opacity:1, y:0, duration:.24, ease:"sine.out" }, .62);
tl.to("#s15", { opacity:0, duration:.18, ease:"power2.in" }, 3.3);

window.__timelines["s15-stats"] = tl;
</script></body></html>
