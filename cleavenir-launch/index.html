<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=1920, height=1080"/>
  <script src="node_modules/gsap/dist/gsap.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:1920px;height:1080px;overflow:hidden;background:#F8FAFC}
    #flash-cover{position:fixed;inset:0;background:#fff;opacity:0;z-index:9999;pointer-events:none}
    #grid-overlay{position:fixed;inset:0;pointer-events:none;z-index:9998;display:grid}
    #grid-overlay .cell{background:#0F172A;transform:scale(0);transform-origin:center center}
    #resolve-cover{position:fixed;inset:0;background:#F8FAFC;opacity:0;z-index:10000;pointer-events:none}
  </style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="54" data-width="1920" data-height="1080">

  <div id="slot-s01" data-composition-id="s01-logo-reveal"   data-composition-src="compositions/s01-logo-reveal.html"    data-start="0"    data-duration="4"></div>
  <div id="slot-s02" data-composition-id="s02-problem"       data-composition-src="compositions/s02-problem.html"         data-start="4"    data-duration="3"></div>
  <div id="slot-s03" data-composition-id="s03-app-hero"      data-composition-src="compositions/s03-app-hero.html"        data-start="7"    data-duration="3.5"></div>
  <div id="slot-s04" data-composition-id="s04-quiz"          data-composition-src="compositions/s04-quiz.html"            data-start="10.5" data-duration="3"></div>
  <div id="slot-s05" data-composition-id="s05-resultats"     data-composition-src="compositions/s05-resultats.html"       data-start="13.5" data-duration="3.5"></div>
  <div id="slot-s06" data-composition-id="s06-cleo"          data-composition-src="compositions/s06-cleo.html"            data-start="17"   data-duration="4"></div>
  <div id="slot-s07" data-composition-id="s07-metiers"       data-composition-src="compositions/s07-metiers.html"         data-start="21"   data-duration="3"></div>
  <div id="slot-s08" data-composition-id="s08-fiche-metier"  data-composition-src="compositions/s08-fiche-metier.html"    data-start="24"   data-duration="3"></div>
  <div id="slot-s09" data-composition-id="s09-formations"    data-composition-src="compositions/s09-formations.html"      data-start="27"   data-duration="3.5"></div>
  <div id="slot-s10" data-composition-id="s10-offres"        data-composition-src="compositions/s10-offres.html"          data-start="30.5" data-duration="3"></div>
  <div id="slot-s11" data-composition-id="s11-cv"            data-composition-src="compositions/s11-cv.html"              data-start="33.5" data-duration="3.5"></div>
  <div id="slot-s12" data-composition-id="s12-lettre"        data-composition-src="compositions/s12-lettre.html"          data-start="37"   data-duration="3"></div>
  <div id="slot-s13" data-composition-id="s13-dashboard"     data-composition-src="compositions/s13-dashboard.html"       data-start="40"   data-duration="3.5"></div>
  <div id="slot-s14" data-composition-id="s14-cleo-conseil"  data-composition-src="compositions/s14-cleo-conseil.html"    data-start="43.5" data-duration="3"></div>
  <div id="slot-s15" data-composition-id="s15-stats"         data-composition-src="compositions/s15-stats.html"           data-start="46.5" data-duration="3.5"></div>
  <div id="slot-s16" data-composition-id="s16-cta"           data-composition-src="compositions/s16-cta.html"             data-start="50"   data-duration="4"></div>

  <div id="flash-cover"   data-layout-ignore></div>
  <div id="grid-overlay"  data-layout-ignore></div>
  <div id="resolve-cover" data-layout-ignore></div>

  <audio id="el-music" data-start="0" data-duration="54" data-track-index="3" data-volume="0.35" src="assets/music.mp3"></audio>
</div>

<script>
window.__timelines = window.__timelines || {};
var tl = gsap.timeline({ paused: true });

(function() {
  var COLS = 16, ROWS = 9;
  var grid = document.getElementById("grid-overlay");
  grid.style.gridTemplateColumns = "repeat("+COLS+",1fr)";
  grid.style.gridTemplateRows   = "repeat("+ROWS+",1fr)";
  for (var i = 0; i < COLS * ROWS; i++) {
    var cell = document.createElement("div");
    cell.className = "cell";
    grid.appendChild(cell);
  }
})();

function flash(t) {
  tl.to("#flash-cover", { opacity:1, duration:.05, ease:"none" }, t);
  tl.to("#flash-cover", { opacity:0, duration:.22, ease:"power2.out" }, t + .05);
}

function gridCover(t, from) {
  tl.to(".cell", { scale:1, duration:.15, stagger:{ amount:.12, from:from||"center" }, ease:"power2.in" }, t);
  tl.to(".cell", { scale:0, duration:.15, stagger:{ amount:.12, from:"edges" }, ease:"power2.out" }, t + .18);
}

/* Flash cuts at each scene boundary - 0.05s */
flash(3.92);
flash(6.92);
flash(10.42);
flash(16.92);
flash(20.92);
flash(23.92);
flash(30.42);
flash(33.42);
flash(36.92);
flash(43.42);
flash(46.42);
flash(49.92);

/* Grid pixelate at 13.22, 26.72, 39.72 */
gridCover(13.22, "center");
gridCover(26.72, "random");
gridCover(39.72, "edges");

/* Resolve (white) */
tl.fromTo("#resolve-cover", { opacity:0 }, { opacity:1, duration:1.5, ease:"power2.inOut" }, 52.5);

window.__timelines["main"] = tl;
</script>
</body>
</html>
