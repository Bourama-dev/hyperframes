<!doctype html><html lang="fr"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=1920,height=1080"/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="node_modules/gsap/dist/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#060A14}
#s03{position:relative;width:1920px;height:1080px;overflow:hidden;background:#060A14;display:flex;flex-direction:column;align-items:center;justify-content:center}
.bg-orb{position:absolute;border-radius:50%;pointer-events:none;filter:blur(100px)}
.grad{background:linear-gradient(135deg,#E91E8C,#06B6D4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
/* Header */
#s03-head{text-align:center;margin-bottom:52px}
.s03-eyebrow{font-family:"Inter",sans-serif;font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:rgba(233,30,140,.8);margin-bottom:14px;display:flex;align-items:center;justify-content:center;gap:8px}
.s03-title{font-family:"Outfit",sans-serif;font-size:80px;font-weight:900;line-height:.88;letter-spacing:-.04em;color:white}
/* Sector grid */
#s03-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;width:1560px}
.sc{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:30px 24px 26px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;position:relative;overflow:hidden;transition:none}
.sc-glow{position:absolute;inset:0;opacity:0;border-radius:22px}
.sc-icon{font-size:40px;line-height:1}
.sc-name{font-family:"Outfit",sans-serif;font-size:19px;font-weight:800;color:white;letter-spacing:-.02em}
.sc-count{font-family:"Outfit",sans-serif;font-size:28px;font-weight:900;margin-top:2px}
.sc-label{font-family:"Inter",sans-serif;font-size:12px;color:rgba(255,255,255,.35);margin-top:-4px}
.sc-bar{width:48px;height:3px;border-radius:2px;margin-top:6px;opacity:.7}
</style>
</head><body>
<div id="s03" data-composition-id="s03-secteurs" data-width="1920" data-height="1080" data-start="0" data-duration="4">

  <div class="bg-orb" style="width:900px;height:900px;top:50%;left:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(233,30,140,.05) 0%,rgba(6,182,212,.03) 50%,transparent 70%)"></div>
  <div class="bg-orb" style="width:500px;height:500px;top:-100px;left:100px;background:rgba(139,47,201,.04)"></div>
  <div class="bg-orb" style="width:400px;height:400px;bottom:-80px;right:100px;background:rgba(6,182,212,.04)"></div>

  <div id="s03-head">
    <div class="s03-eyebrow">✦ Explore tous les domaines</div>
    <div id="s03-title" class="s03-title"><span class="grad">8 secteurs</span> qui recrutent</div>
  </div>

  <div id="s03-grid">
    <div class="sc" id="sc1"><div class="sc-glow" style="background:radial-gradient(circle at 50% 0%,rgba(233,30,140,.12),transparent 70%)"></div><div class="sc-icon">💻</div><div class="sc-name">Tech & Dev</div><div class="sc-count" style="color:#E91E8C">84 000</div><div class="sc-label">offres</div><div class="sc-bar" style="background:#E91E8C"></div></div>
    <div class="sc" id="sc2"><div class="sc-glow" style="background:radial-gradient(circle at 50% 0%,rgba(6,182,212,.12),transparent 70%)"></div><div class="sc-icon">🏥</div><div class="sc-name">Santé</div><div class="sc-count" style="color:#06B6D4">62 000</div><div class="sc-label">offres</div><div class="sc-bar" style="background:#06B6D4"></div></div>
    <div class="sc" id="sc3"><div class="sc-glow" style="background:radial-gradient(circle at 50% 0%,rgba(139,47,201,.12),transparent 70%)"></div><div class="sc-icon">🛒</div><div class="sc-name">Commerce</div><div class="sc-count" style="color:#8B2FC9">71 000</div><div class="sc-label">offres</div><div class="sc-bar" style="background:#8B2FC9"></div></div>
    <div class="sc" id="sc4"><div class="sc-glow" style="background:radial-gradient(circle at 50% 0%,rgba(245,158,11,.1),transparent 70%)"></div><div class="sc-icon">🍽️</div><div class="sc-name">Restauration</div><div class="sc-count" style="color:#F59E0B">48 000</div><div class="sc-label">offres</div><div class="sc-bar" style="background:#F59E0B"></div></div>
    <div class="sc" id="sc5"><div class="sc-glow" style="background:radial-gradient(circle at 50% 0%,rgba(6,182,212,.12),transparent 70%)"></div><div class="sc-icon">🚗</div><div class="sc-name">Transport</div><div class="sc-count" style="color:#06B6D4">39 000</div><div class="sc-label">offres</div><div class="sc-bar" style="background:#06B6D4"></div></div>
    <div class="sc" id="sc6"><div class="sc-glow" style="background:radial-gradient(circle at 50% 0%,rgba(34,197,94,.1),transparent 70%)"></div><div class="sc-icon">🏗️</div><div class="sc-name">Construction</div><div class="sc-count" style="color:#22C55E">45 000</div><div class="sc-label">offres</div><div class="sc-bar" style="background:#22C55E"></div></div>
    <div class="sc" id="sc7"><div class="sc-glow" style="background:radial-gradient(circle at 50% 0%,rgba(139,47,201,.12),transparent 70%)"></div><div class="sc-icon">💰</div><div class="sc-name">Finance</div><div class="sc-count" style="color:#8B2FC9">33 000</div><div class="sc-label">offres</div><div class="sc-bar" style="background:#8B2FC9"></div></div>
    <div class="sc" id="sc8"><div class="sc-glow" style="background:radial-gradient(circle at 50% 0%,rgba(233,30,140,.1),transparent 70%)"></div><div class="sc-icon">🎨</div><div class="sc-name">Arts & Médias</div><div class="sc-count" style="color:#E91E8C">28 000</div><div class="sc-label">offres</div><div class="sc-bar" style="background:#E91E8C"></div></div>
  </div>

</div>
<script>
window.__timelines = window.__timelines || {};
var tl = gsap.timeline({ paused: true });
var cards = ["#sc1","#sc2","#sc3","#sc4","#sc5","#sc6","#sc7","#sc8"];

gsap.set("#s03-head", { opacity:0, y:-30 });
gsap.set(cards, { opacity:0, y:40, scale:.92 });

tl.fromTo("#s03-head", { opacity:0, y:-30 }, { opacity:1, y:0, duration:.4, ease:"power3.out" }, .05);

cards.forEach(function(id, i) {
  tl.fromTo(id, { opacity:0, y:40, scale:.92 }, { opacity:1, y:0, scale:1, duration:.3, ease:"back.out(1.5)" }, .35 + i * .07);
  /* Glow reveal on each card */
  tl.to(id + " .sc-glow", { opacity:1, duration:.5, ease:"power2.out" }, .55 + i * .07);
});

tl.to("#s03", { opacity:0, duration:.2, ease:"power2.in" }, 3.78);

window.__timelines["s03-secteurs"] = tl;
</script></body></html>
