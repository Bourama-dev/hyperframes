.app-sub{font-family:-apple-system,sans-serif;font-size:13px;color:rgba(255,255,255,.5)}

<script>
window.__timelines = window.__timelines || {};
var tl = gsap.timeline({ paused: true });

gsap.set("#char-left", { opacity:0, x:-60 });
gsap.set("#char-right", { opacity:0, x:60, scaleX:-1 });
gsap.set("#s01-title", { opacity:0, y:24 });
gsap.set("#screen-off", { opacity:1 });
gsap.set("#screen-logo", { opacity:0 });
gsap.set("#screen-white", { opacity:0 });
gsap.set("#phone-halo", { opacity:0 });

/* Characters + title enter */
tl.fromTo("#char-left",  { opacity:0, x:-60 }, { opacity:1, x:0, duration:.5, ease:"power3.out" }, 0);
tl.fromTo("#char-right", { opacity:0, x:60, scaleX:-1 }, { opacity:1, x:0, scaleX:-1, duration:.5, ease:"power3.out" }, .08);
tl.fromTo("#s01-title",  { opacity:0, y:24  }, { opacity:1, y:0, duration:.4, ease:"power3.out" }, .22);

/* Phone powers on */
tl.to("#screen-off",  { opacity:0, duration:.3, ease:"power2.out" }, .8);
tl.to("#screen-logo", { opacity:1, duration:.25, ease:"power2.out" }, 1.0);
tl.to("#phone-halo",  { opacity:1, duration:.5, ease:"power2.out" }, .9);

/* Characters bounce (excitement) */
tl.to("#char-left",  { y:-16, scaleX:.96, duration:.18, ease:"power2.out", transformOrigin:"bottom center" }, 1.2);
tl.to("#char-left",  { y:0, scaleX:1, duration:.3, ease:"elastic.out(1,.5)", transformOrigin:"bottom center" }, 1.38);
tl.to("#char-right", { y:-16, scaleX:-.96, duration:.18, ease:"power2.out", transformOrigin:"bottom center" }, 1.28);
tl.to("#char-right", { y:0, scaleX:-1, duration:.3, ease:"elastic.out(1,.5)", transformOrigin:"bottom center" }, 1.46);

/* Zoom into phone */
tl.to("#iphone-wrap", { scale:12, duration:1.2, ease:"power2.in", transformOrigin:"center center" }, 2.2);
tl.to("#char-left,#char-right,#s01-title,#phone-halo", { opacity:0, duration:.35 }, 2.2);

/* White flash for transition */
tl.to("#screen-white", { opacity:1, duration:.35, ease:"power2.in" }, 3.3);

window.__timelines["s01-hook"] = tl;
