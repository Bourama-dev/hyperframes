<!doctype html><html lang="fr"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=1920,height=1080"/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#F8FAFC}
#s01{position:relative;width:1920px;height:1080px;background:#F8FAFC;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}
.grad{background:linear-gradient(135deg,#E91E8C,#06B6D4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
#s01-eyebrow{display:inline-flex;align-items:center;gap:8px;background:rgba(233,30,140,.08);border:1px solid rgba(233,30,140,.2);border-radius:100px;padding:8px 20px;font-family:"Inter",sans-serif;font-weight:600;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:#E91E8C;margin-bottom:28px}
#s01-counter-wrap{display:flex;align-items:flex-end;gap:20px;margin-bottom:16px}
#s01-count{font-family:"Outfit",sans-serif;font-size:200px;font-weight:900;line-height:.9;letter-spacing:-.04em;color:#0F172A}
#s01-count-plus{font-family:"Outfit",sans-serif;font-size:100px;font-weight:900;line-height:1;letter-spacing:-.02em;margin-bottom:8px}
#s01-label{font-family:"Outfit",sans-serif;font-size:56px;font-weight:800;color:#0F172A;letter-spacing:-.02em;text-align:center;margin-bottom:40px}
#s01-sub{font-family:"Inter",sans-serif;font-size:22px;color:#64748B;font-weight:400;text-align:center;letter-spacing:.01em}
.dot-live{width:10px;height:10px;border-radius:50%;background:#E91E8C;display:inline-block;margin-right:6px}
#s01-bg-circle1{position:absolute;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(233,30,140,.06) 0%,transparent 70%);top:-200px;right:-200px;pointer-events:none}
#s01-bg-circle2{position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(6,182,212,.06) 0%,transparent 70%);bottom:-100px;left:-100px;pointer-events:none}
</style></head><body>
<div id="s01" data-composition-id="s01-hook" data-width="1920" data-height="1080" data-start="0" data-duration="4">
  <div id="s01-bg-circle1"></div>
  <div id="s01-bg-circle2"></div>
  <div id="s01-eyebrow"><span class="dot-live"></span>Offres d'emploi · CléAvenir</div>
  <div id="s01-counter-wrap">
    <div id="s01-count" class="grad">0</div>
    <div id="s01-count-plus" class="grad">+</div>
  </div>
  <div id="s01-label">offres d'emploi disponibles</div>
  <div id="s01-sub">Mises à jour en continu · Tous secteurs · Partout en France</div>
</div>
<script>
window.__timelines = window.__timelines || {};
var tl = gsap.timeline({ paused: true });
var counter = { val: 0 };

gsap.set("#s01-eyebrow", { opacity:0, y:-20 });
gsap.set("#s01-counter-wrap", { opacity:0, scale:.85 });
gsap.set("#s01-label", { opacity:0, y:20 });
gsap.set("#s01-sub", { opacity:0 });
gsap.set("#s01-bg-circle1,#s01-bg-circle2", { scale:.5, opacity:0 });

tl.fromTo("#s01-bg-circle1,#s01-bg-circle2", { scale:.5, opacity:0 }, { scale:1, opacity:1, duration:1.2, ease:"power2.out" }, 0);
tl.fromTo("#s01-eyebrow", { opacity:0, y:-20 }, { opacity:1, y:0, duration:.3, ease:"power3.out" }, 0.1);
tl.fromTo("#s01-counter-wrap", { opacity:0, scale:.85 }, { opacity:1, scale:1, duration:.35, ease:"back.out(1.5)" }, 0.2);
tl.to(counter, { val: 1248, duration: 1.8, ease:"expo.out", onUpdate: function() {
  document.getElementById("s01-count").textContent = Math.round(counter.val).toLocaleString("fr-FR");
}}, 0.25);
tl.fromTo("#s01-label", { opacity:0, y:20 }, { opacity:1, y:0, duration:.3, ease:"power3.out" }, 0.35);
tl.fromTo("#s01-sub", { opacity:0 }, { opacity:1, duration:.3, ease:"power2.out" }, 0.5);
tl.to("#s01", { opacity:0, duration:.18, ease:"power2.in" }, 3.78);

window.__timelines["s01-hook"] = tl;
</script></body></html>
