<!doctype html><html lang="fr"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=1920,height=1080"/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="node_modules/gsap/dist/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#060A14}
#s01{position:relative;width:1920px;height:1080px;overflow:hidden;background:#060A14}
/* Orbs */
.orb{position:absolute;border-radius:50%;pointer-events:none}
/* iPhone */
#iphone-wrap{position:absolute;left:785px;top:163px;width:350px;height:755px;transform-origin:center center;z-index:10}
#iphone-outer{width:350px;height:755px;background:linear-gradient(150deg,#1E2030,#12141E);border-radius:48px;position:relative;
  box-shadow:0 0 0 1.5px rgba(255,255,255,.08),0 60px 140px rgba(0,0,0,.9),inset 0 0 0 2px rgba(255,255,255,.04)}
#iphone-screen{width:292px;height:630px;background:#060A14;border-radius:36px;position:absolute;left:29px;top:62px;overflow:hidden}
#iphone-notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:110px;height:34px;background:#060A14;border-radius:0 0 20px 20px;z-index:20}
#iphone-home{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:120px;height:5px;background:rgba(255,255,255,.25);border-radius:3px}
#iphone-side{position:absolute;right:-3px;top:200px;width:4px;height:72px;background:#1E2030;border-radius:2px}
#iphone-vol1{position:absolute;left:-3px;top:170px;width:4px;height:42px;background:#1E2030;border-radius:2px}
#iphone-vol2{position:absolute;left:-3px;top:220px;width:4px;height:62px;background:#1E2030;border-radius:2px}
/* Screen states */
#screen-off{position:absolute;inset:0;background:#000;z-index:5;border-radius:36px}
#screen-logo{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(145deg,#0C0520,#060E1C)}
.app-icon{width:88px;height:88px;border-radius:22px;background:linear-gradient(135deg,#E91E8C,#8B2FC9,#06B6D4);display:flex;align-items:center;justify-content:center;font-size:46px;box-shadow:0 16px 50px rgba(233,30,140,.35),0 0 0 1px rgba(255,255,255,.08)}
.app-name{font-family:"Outfit",sans-serif;font-size:22px;font-weight:900;color:white;letter-spacing:-.5px}
.app-sub{font-family:"Inter",sans-serif;font-size:12px;color:rgba(255,255,255,.4);letter-spacing:.04em}
.screen-bar{width:60%;height:1px;background:linear-gradient(90deg,transparent,rgba(233,30,140,.4),rgba(6,182,212,.4),transparent);margin-top:6px}
#screen-white{position:absolute;inset:0;background:white;opacity:0;z-index:10;border-radius:36px}
/* Floating stat pills around phone */
.stat-pill{position:absolute;z-index:8;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:100px;padding:10px 20px;white-space:nowrap;backdrop-filter:blur(8px)}
.sp-val{font-family:"Outfit",sans-serif;font-size:20px;font-weight:900;color:white}
.sp-lbl{font-family:"Inter",sans-serif;font-size:12px;color:rgba(255,255,255,.45);margin-top:2px}
/* Left title */
#s01-left{position:absolute;left:100px;top:270px;z-index:5}
.s01-eyebrow{font-family:"Inter",sans-serif;font-size:13px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:rgba(233,30,140,.8);margin-bottom:20px;display:flex;align-items:center;gap:8px}
.dot-pulse{width:8px;height:8px;border-radius:50%;background:#E91E8C}
.s01-title{font-family:"Outfit",sans-serif;font-size:80px;font-weight:900;line-height:.88;letter-spacing:-.04em;color:white;margin-bottom:24px}
.grad{background:linear-gradient(135deg,#E91E8C,#06B6D4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.s01-sub{font-family:"Inter",sans-serif;font-size:18px;color:rgba(255,255,255,.4);line-height:1.6;max-width:340px}
/* Halo glow */
#phone-halo{position:absolute;left:680px;top:60px;width:560px;height:960px;border-radius:80px;pointer-events:none;z-index:2;opacity:0;
  background:radial-gradient(ellipse at center,rgba(233,30,140,.06) 0%,rgba(6,182,212,.04) 50%,transparent 70%);
  box-shadow:0 0 120px 60px rgba(233,30,140,.08),0 0 240px 120px rgba(6,182,212,.04)}
</style>
</head><body>
<div id="s01" data-composition-id="s01-hook" data-width="1920" data-height="1080" data-start="0" data-duration="4">

  <!-- Background orbs -->
  <div class="orb" style="width:800px;height:800px;top:-200px;right:50px;background:radial-gradient(circle,rgba(233,30,140,.04) 0%,transparent 70%);filter:blur(60px)"></div>
  <div class="orb" style="width:600px;height:600px;bottom:-100px;left:50px;background:radial-gradient(circle,rgba(6,182,212,.04) 0%,transparent 70%);filter:blur(60px)"></div>

  <div id="phone-halo"></div>

  <!-- iPhone -->
  <div id="iphone-wrap">
    <div id="iphone-outer">
      <div id="iphone-notch"></div>
      <div id="iphone-side"></div>
      <div id="iphone-vol1"></div>
      <div id="iphone-vol2"></div>
      <div id="iphone-screen">
        <div id="screen-off"></div>
        <div id="screen-logo">
          <div class="app-icon">🎯</div>
          <div class="app-name">CléAvenir</div>
          <div class="screen-bar"></div>
          <div class="app-sub">496 000 OFFRES</div>
        </div>
        <div id="screen-white"></div>
      </div>
      <div id="iphone-home"></div>
    </div>
  </div>

  <!-- Stat pills -->
  <div class="stat-pill" id="sp1" style="left:120px;top:180px"><div class="sp-val">💻 84 000</div><div class="sp-lbl">Tech & Dev</div></div>
  <div class="stat-pill" id="sp2" style="left:80px;top:420px"><div class="sp-val">🏥 62 000</div><div class="sp-lbl">Santé</div></div>
  <div class="stat-pill" id="sp3" style="left:140px;top:660px"><div class="sp-val">🛒 71 000</div><div class="sp-lbl">Commerce</div></div>
  <div class="stat-pill" id="sp4" style="right:120px;top:200px"><div class="sp-val">🍽️ 48 000</div><div class="sp-lbl">Restauration</div></div>
  <div class="stat-pill" id="sp5" style="right:80px;top:460px"><div class="sp-val">🏗️ 45 000</div><div class="sp-lbl">Construction</div></div>
  <div class="stat-pill" id="sp6" style="right:130px;top:720px"><div class="sp-val">💰 33 000</div><div class="sp-lbl">Finance</div></div>

  <!-- Left title -->
  <div id="s01-left">
    <div class="s01-eyebrow"><div class="dot-pulse"></div>CléAvenir · Live</div>
    <div class="s01-title"><span class="grad">496 000</span><br>offres<br>t'attendent.</div>
    <div class="s01-sub">Toutes les offres d'emploi en France, filtrées pour ton profil.</div>
  </div>

</div>
<script>
window.__timelines = window.__timelines || {};
var tl = gsap.timeline({ paused: true });

gsap.set("#s01-left", { opacity:0, x:-40 });
gsap.set("#sp1,#sp2,#sp3,#sp4,#sp5,#sp6", { opacity:0, scale:.8 });
gsap.set("#screen-off", { opacity:1 });
gsap.set("#screen-logo", { opacity:0 });
gsap.set("#screen-white", { opacity:0 });
gsap.set("#phone-halo", { opacity:0 });

/* Left text enters */
tl.fromTo("#s01-left", { opacity:0, x:-40 }, { opacity:1, x:0, duration:.5, ease:"power3.out" }, 0);

/* Stat pills stagger in */
tl.fromTo("#sp1,#sp4", { opacity:0, scale:.8 }, { opacity:1, scale:1, duration:.3, stagger:.08, ease:"back.out(1.5)" }, .15);
tl.fromTo("#sp2,#sp5", { opacity:0, scale:.8 }, { opacity:1, scale:1, duration:.3, stagger:.08, ease:"back.out(1.5)" }, .28);
tl.fromTo("#sp3,#sp6", { opacity:0, scale:.8 }, { opacity:1, scale:1, duration:.3, stagger:.08, ease:"back.out(1.5)" }, .42);

/* Phone powers on */
tl.to("#screen-off",  { opacity:0, duration:.3, ease:"power2.out" }, .7);
tl.to("#screen-logo", { opacity:1, duration:.25, ease:"power2.out" }, .9);
tl.to("#phone-halo",  { opacity:1, duration:.6, ease:"power2.out" }, .8);

/* Zoom into phone */
tl.to("#iphone-wrap", { scale:12, duration:1.2, ease:"power2.in", transformOrigin:"center center" }, 2.2);
tl.to("#s01-left,#sp1,#sp2,#sp3,#sp4,#sp5,#sp6,#phone-halo", { opacity:0, duration:.3 }, 2.2);

/* White fill */
tl.to("#screen-white", { opacity:1, duration:.35, ease:"power2.in" }, 3.3);

window.__timelines["s01-hook"] = tl;
</script></body></html>
