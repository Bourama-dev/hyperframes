<!doctype html><html lang="fr"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=1920,height=1080"/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="node_modules/gsap/dist/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#F4F6FB}
#s01{position:relative;width:1920px;height:1080px;overflow:hidden;background:#F4F6FB;display:flex;align-items:center;justify-content:center}
.orb{position:absolute;border-radius:50%;pointer-events:none;filter:blur(80px)}
.stat-pill{position:absolute;z-index:8;background:#fff;border:1.5px solid #ECEEF2;border-radius:100px;padding:12px 22px;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.08)}
.sp-val{font-family:"Outfit",sans-serif;font-size:20px;font-weight:900;color:#111827}
.sp-lbl{font-family:"Inter",sans-serif;font-size:12px;color:#9CA3AF;margin-top:2px}
#s01-center{position:relative;z-index:5;display:flex;flex-direction:column;align-items:center;text-align:center}
.s01-eyebrow{font-family:"Inter",sans-serif;font-size:13px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#E91E8C;margin-bottom:20px;display:flex;align-items:center;justify-content:center;gap:8px}
.dot-pulse{width:8px;height:8px;border-radius:50%;background:#E91E8C}
.s01-title{font-family:"Outfit",sans-serif;font-size:120px;font-weight:900;line-height:.88;letter-spacing:-.04em;color:#111827;margin-bottom:28px}
.grad{background:linear-gradient(135deg,#E91E8C,#06B6D4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.s01-sub{font-family:"Inter",sans-serif;font-size:22px;color:#6B7280;line-height:1.6;max-width:640px;margin-bottom:20px}
.ft-mention{display:inline-flex;align-items:center;gap:6px;font-family:"Inter",sans-serif;font-size:14px;color:#9CA3AF}
</style>
</head><body>
<div id="s01" data-composition-id="s01-hook" data-width="1920" data-height="1080" data-start="0" data-duration="4">

  <div class="orb" style="width:700px;height:700px;top:-200px;right:50px;background:rgba(233,30,140,.07)"></div>
  <div class="orb" style="width:600px;height:600px;bottom:-100px;left:50px;background:rgba(6,182,212,.06)"></div>
  <div class="orb" style="width:500px;height:500px;top:50%;left:50%;background:rgba(139,47,201,.04)"></div>

  <div class="stat-pill" id="sp1" style="left:120px;top:200px"><div class="sp-val">💻 84 000</div><div class="sp-lbl">Tech & Dev</div></div>
  <div class="stat-pill" id="sp2" style="left:80px;top:440px"><div class="sp-val">🏥 62 000</div><div class="sp-lbl">Santé</div></div>
  <div class="stat-pill" id="sp3" style="left:140px;top:680px"><div class="sp-val">🛒 71 000</div><div class="sp-lbl">Commerce</div></div>
  <div class="stat-pill" id="sp4" style="right:120px;top:200px"><div class="sp-val">🍽️ 48 000</div><div class="sp-lbl">Restauration</div></div>
  <div class="stat-pill" id="sp5" style="right:80px;top:440px"><div class="sp-val">🏗️ 45 000</div><div class="sp-lbl">Construction</div></div>
  <div class="stat-pill" id="sp6" style="right:140px;top:680px"><div class="sp-val">💰 33 000</div><div class="sp-lbl">Finance</div></div>

  <div id="s01-center">
    <div class="s01-eyebrow"><div class="dot-pulse"></div>CléAvenir · Live</div>
    <div class="s01-title"><span class="grad">496 000</span><br>offres<br>t'attendent.</div>
    <div class="s01-sub">Toutes les offres d'emploi en France, filtrées pour ton profil.</div>
    <div class="ft-mention"><span>🏛️</span>Données issues de France Travail</div>
  </div>

</div>
<script>
window.__timelines = window.__timelines || {};
var tl = gsap.timeline({ paused: true });

gsap.set("#s01-center", { opacity:0, y:30 });
gsap.set("#sp1,#sp2,#sp3,#sp4,#sp5,#sp6", { opacity:0, scale:.8 });

tl.fromTo("#s01-center", { opacity:0, y:30 }, { opacity:1, y:0, duration:.5, ease:"power3.out" }, 0);
tl.fromTo("#sp1,#sp4", { opacity:0, scale:.8 }, { opacity:1, scale:1, duration:.3, stagger:.08, ease:"back.out(1.5)" }, .2);
tl.fromTo("#sp2,#sp5", { opacity:0, scale:.8 }, { opacity:1, scale:1, duration:.3, stagger:.08, ease:"back.out(1.5)" }, .34);
tl.fromTo("#sp3,#sp6", { opacity:0, scale:.8 }, { opacity:1, scale:1, duration:.3, stagger:.08, ease:"back.out(1.5)" }, .48);
tl.to("#s01", { opacity:0, duration:.2, ease:"power2.in" }, 3.78);

window.__timelines["s01-hook"] = tl;
</script></body></html>
