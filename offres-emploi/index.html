<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=1080, height=1920"/>
  <script src="node_modules/gsap/dist/gsap.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:1080px;height:1920px;overflow:hidden;background:#0D1117}
    #flash-cover{position:fixed;inset:0;background:#fff;opacity:0;z-index:9999;pointer-events:none}
    #grid-overlay{position:fixed;inset:0;pointer-events:none;z-index:9998;display:grid}
    #grid-overlay .cell{background:#E91E8C;transform-origin:center center}
    #bubble-overlay{position:fixed;inset:0;pointer-events:none;z-index:9997;overflow:hidden}
    .bbl{position:absolute;border-radius:50%;transform-origin:center center}
    #resolve-cover{position:fixed;inset:0;background:#0A0F1E;opacity:0;z-index:10000;pointer-events:none}
  </style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="24" data-width="1080" data-height="1920">

  <div id="slot-s01" class="clip" data-composition-id="s01-hook"     data-composition-src="compositions/s01-hook.html"     data-start="0"    data-duration="4"   data-track-index="1"></div>
  <div id="slot-s02" class="clip" data-composition-id="s02-app"      data-composition-src="compositions/s02-app.html"      data-start="4"    data-duration="3.5" data-track-index="2"></div>
  <div id="slot-s03" class="clip" data-composition-id="s03-secteurs" data-composition-src="compositions/s03-secteurs.html" data-start="7.5"  data-duration="4"   data-track-index="3"></div>
  <div id="slot-s04" class="clip" data-composition-id="s04-match"    data-composition-src="compositions/s04-match.html"    data-start="11.5" data-duration="3.5" data-track-index="4"></div>
  <div id="slot-s05" class="clip" data-composition-id="s05-postuler" data-composition-src="compositions/s05-postuler.html" data-start="15"   data-duration="4"   data-track-index="5"></div>
  <div id="slot-s06" class="clip" data-composition-id="s06-cta"      data-composition-src="compositions/s06-cta.html"      data-start="19"   data-duration="5"   data-track-index="6"></div>

  <div id="flash-cover"    data-layout-ignore></div>
  <div id="grid-overlay"   data-layout-ignore></div>
  <div id="bubble-overlay" data-layout-ignore></div>
  <div id="resolve-cover"  data-layout-ignore></div>

  <audio id="el-music"   class="clip" data-start="0"     data-duration="24"   data-track-index="0"  data-volume="0.32" src="assets/music.mp3"></audio>

  <!-- SFX : transitions flash S1→S2, S2→S3, S4→S5 -->
  <audio id="sfx-w1"     class="clip" data-start="3.92"  data-duration="0.55" data-track-index="7"  data-volume="0.55" src="assets/sfx-whoosh.mp3"></audio>
  <audio id="sfx-w2"     class="clip" data-start="7.42"  data-duration="0.55" data-track-index="8"  data-volume="0.55" src="assets/sfx-whoosh.mp3"></audio>
  <audio id="sfx-w3"     class="clip" data-start="14.92" data-duration="0.55" data-track-index="9"  data-volume="0.55" src="assets/sfx-whoosh.mp3"></audio>
  <!-- SFX : scan IA (s04) -->
  <audio id="sfx-sc"     class="clip" data-start="12.4"  data-duration="0.9"  data-track-index="10" data-volume="0.52" src="assets/sfx-scan.mp3"></audio>
  <!-- SFX : succès candidature (s05) -->
  <audio id="sfx-ok"     class="clip" data-start="15.2"  data-duration="1.64" data-track-index="11" data-volume="0.6"  src="assets/sfx-success.mp3"></audio>
  <!-- SFX : bubble wipe S5→S6 -->
  <audio id="sfx-bbl"    class="clip" data-start="18.92" data-duration="0.55" data-track-index="12" data-volume="0.5"  src="assets/sfx-bubble.mp3"></audio>
  <!-- SFX : shimmer bouton CTA (s06) -->
  <audio id="sfx-ting"   class="clip" data-start="19.95" data-duration="0.55" data-track-index="13" data-volume="0.5"  src="assets/sfx-ting.mp3"></audio>
  <!-- SFX : pop cartes offres (s02 + s03) -->
  <audio id="sfx-c1"     class="clip" data-start="4.9"   data-duration="0.09" data-track-index="14" data-volume="0.35" src="assets/sfx-click.mp3"></audio>
  <audio id="sfx-c2"     class="clip" data-start="5.04"  data-duration="0.09" data-track-index="15" data-volume="0.3"  src="assets/sfx-click.mp3"></audio>
  <audio id="sfx-c3"     class="clip" data-start="5.18"  data-duration="0.09" data-track-index="16" data-volume="0.25" src="assets/sfx-click.mp3"></audio>
  <audio id="sfx-c4"     class="clip" data-start="7.85"  data-duration="0.09" data-track-index="17" data-volume="0.28" src="assets/sfx-click.mp3"></audio>
</div>

<script>
window.__timelines = window.__timelines || {};
var tl = gsap.timeline({ paused: true });

(function() {
  var COLS = 9, ROWS = 16;
  var grid = document.getElementById("grid-overlay");
  grid.style.gridTemplateColumns = "repeat("+COLS+",1fr)";
  grid.style.gridTemplateRows   = "repeat("+ROWS+",1fr)";
  for (var i = 0; i < COLS * ROWS; i++) {
    var cell = document.createElement("div");
    cell.className = "cell";
    grid.appendChild(cell);
  }
  gsap.set(".cell", { scale: 0 });
})();

function flash(t) {
  tl.to("#flash-cover", { opacity:1, duration:.05, ease:"none" }, t);
  tl.to("#flash-cover", { opacity:0, duration:.22, ease:"power2.out" }, t + .05);
}

function gridCover(t, from) {
  tl.to(".cell", { scale:1, duration:.15, stagger:{ amount:.12, from:from||"center" }, ease:"power2.in" }, t);
  tl.to(".cell", { scale:0, duration:.15, stagger:{ amount:.12, from:"edges" }, ease:"power2.out" }, t + .18);
}

(function() {
  var bblData = [
    { x:540,  y:960,  d:2400, color:"#EFEFEF" },
    { x:0,    y:0,    d:1600, color:"#E91E8C" },
    { x:1080, y:0,    d:1600, color:"#06B6D4" },
    { x:1080, y:1920, d:1600, color:"#E91E8C" },
    { x:0,    y:1920, d:1600, color:"#06B6D4" },
    { x:540,  y:0,    d:1200, color:"#EFEFEF" },
    { x:540,  y:1920, d:1200, color:"#EFEFEF" },
  ];
  var overlay = document.getElementById("bubble-overlay");
  bblData.forEach(function(b, i) {
    var el = document.createElement("div");
    el.className = "bbl";
    el.id = "bbl" + i;
    el.style.width       = b.d + "px";
    el.style.height      = b.d + "px";
    el.style.left        = (b.x - b.d / 2) + "px";
    el.style.top         = (b.y - b.d / 2) + "px";
    el.style.background  = b.color;
    overlay.appendChild(el);
  });
  gsap.set(".bbl", { scale: 0 });
})();

function bubbleWipe(t) {
  tl.to(".bbl", { scale:1, duration:.18, stagger:{ amount:.12, from:"center" }, ease:"power3.in"  }, t);
  tl.to(".bbl", { scale:0, duration:.16, stagger:{ amount:.10, from:"edges"  }, ease:"power3.out" }, t + .28);
}

/* S1→S2: flash */
flash(3.92);
/* S2→S3: flash */
flash(7.42);
/* S3→S4: grid wipe */
gridCover(11.22, "center");
/* S4→S5: flash */
flash(14.92);
tl.set("#flash-cover", { opacity: 0 }, 15.2);
/* S5→S6: bubble wipe */
bubbleWipe(18.92);
/* Fin: resolve cover */
tl.fromTo("#resolve-cover", { opacity:0 }, { opacity:1, duration:1.5, ease:"power2.inOut" }, 22.5);

window.__timelines["main"] = tl;
</script>
</body>
</html>
