<!doctype html>
<html lang="fr">
<head><meta charset="UTF-8"/></head>
<body>
<template>
<style>
@font-face{font-family:"Syne";font-weight:800;font-style:normal;font-display:swap;src:url(assets/fonts/Syne-800.ttf) format('truetype')}
@font-face{font-family:"Space Grotesk";font-weight:700;font-style:normal;font-display:swap;src:url(assets/fonts/SpaceGrotesk-700.ttf) format('truetype')}
#root{position:relative;width:1920px;height:1080px;background:#000;overflow:hidden}
#portal-flood{position:absolute;inset:0;background:radial-gradient(circle,#fff 0%,#E91E8C 18%,#06B6D4 40%,#0F172A 68%,#000 100%);border-radius:50%;width:0;height:0;top:50%;left:50%;translate:-50% -50%}
.ring{position:absolute;top:50%;left:50%;translate:-50% -50%;border-radius:50%;border:2px solid rgba(6,182,212,.5);width:60px;height:60px;opacity:0}
#orb-wrap{position:absolute;top:50%;left:50%;translate:-50% -50%;width:280px;height:280px}
#orb-core{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 32%,#fff 0%,#E91E8C 30%,#06B6D4 70%,#0F172A 100%);box-shadow:0 0 120px rgba(6,182,212,.5),0 0 240px rgba(233,30,140,.3)}
.node{position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 16px #fff}
#s3-title{position:absolute;top:66%;left:50%;translate:-50% 0;text-align:center;opacity:0}
#s3-name{font-family:"Syne",sans-serif;font-weight:800;font-size:72px;color:#fff;letter-spacing:-.01em}
#s3-tag{font-family:"Inter",sans-serif;font-weight:300;font-size:26px;color:#94A3B8;margin-top:10px}
#s3-badge{display:inline-flex;align-items:center;gap:8px;font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:14px;letter-spacing:.06em;color:#06B6D4;background:rgba(6,182,212,.08);border:1px solid rgba(6,182,212,.25);border-radius:100px;padding:8px 20px;margin-top:20px}
</style>

<div id="root" data-composition-id="s03-la-rencontre" data-width="1920" data-height="1080">
  <div id="portal-flood"></div>
  <div class="ring" id="r1"></div>
  <div class="ring" id="r2"></div>
  <div class="ring" id="r3"></div>
  <div id="orb-wrap">
    <div id="orb-core"></div>
    <div class="node" id="n1" style="top:-10px;left:50%"></div>
    <div class="node" id="n2" style="top:50%;right:-10px"></div>
    <div class="node" id="n3" style="bottom:-10px;left:50%"></div>
    <div class="node" id="n4" style="top:50%;left:-10px"></div>
  </div>
  <div id="s3-title">
    <div id="s3-name">Cleo</div>
    <div id="s3-tag">Ton assistante IA, disponible 24h/24.</div>
    <div id="s3-badge">✦ L'IA de CléAvenir</div>
  </div>
</div>

<script>
window.__timelines = window.__timelines || {};
var tl = gsap.timeline({ paused: true });

gsap.set("#orb-wrap", { scale: 0, opacity: 0 });
gsap.set(".node", { scale: 0 });
gsap.set("#s3-title", { y: 16 });

/* a single point of light expands into a portal that floods the screen */
tl.to("#portal-flood", { width: 3200, height: 3200, duration: 1.1, ease: "power3.in" }, .1);
tl.to("#portal-flood", { opacity: 0, duration: .6, ease: "power2.out" }, 1.15);

/* concentric rings pulse outward from the portal's center */
tl.fromTo("#r1", { opacity: .9, scale: .2 }, { opacity: 0, scale: 8, duration: 1.4, ease: "power2.out" }, 1.0);
tl.fromTo("#r2", { opacity: .7, scale: .2 }, { opacity: 0, scale: 8, duration: 1.4, ease: "power2.out" }, 1.2);
tl.fromTo("#r3", { opacity: .5, scale: .2 }, { opacity: 0, scale: 8, duration: 1.4, ease: "power2.out" }, 1.4);

/* Cleo resolves at the portal's heart */
tl.to("#orb-wrap", { scale: 1, opacity: 1, duration: 1, ease: "back.out(1.4)" }, 1.2);
tl.to("#orb-core", { rotate: 360, duration: 6, ease: "none" }, 1.2);
tl.to(".node", { scale: 1, duration: .5, stagger: .08, ease: "back.out(2)" }, 1.6);
tl.to("#orb-wrap", { rotate: 300, duration: 5, ease: "none" }, 1.6);

tl.to("#s3-title", { opacity: 1, y: 0, duration: .8, ease: "power2.out" }, 2.6);

/* hold, then dissolve into the transformation montage */
tl.to("#root", { opacity: 0, duration: .5, ease: "power2.in" }, 7.4);

window.__timelines["s03-la-rencontre"] = tl;
</script>
</template>
</body>
</html>
