<!doctype html>
<html lang="fr">
<head><meta charset="UTF-8"/></head>
<body>
<template>
<style>
@font-face{font-family:"Syne";font-weight:800;font-style:normal;font-display:swap;src:url(assets/fonts/Syne-800.ttf) format('truetype')}
@font-face{font-family:"Space Grotesk";font-weight:700;font-style:normal;font-display:swap;src:url(assets/fonts/SpaceGrotesk-700.ttf) format('truetype')}
#root{position:relative;width:1920px;height:1080px;background:#0A0F1E;overflow:hidden;perspective:1600px}
#s4-bg{position:absolute;inset:-10%;background:radial-gradient(circle at 30% 30%,rgba(233,30,140,.16) 0%,transparent 45%),radial-gradient(circle at 75% 70%,rgba(6,182,212,.16) 0%,transparent 45%)}
.beat{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;opacity:0}
.card{width:900px;padding:60px 70px;background:rgba(15,23,42,.6);border:1px solid rgba(148,163,184,.18);border-radius:28px;box-shadow:0 40px 100px rgba(0,0,0,.5);text-align:center}
.icon{font-size:72px;line-height:1;color:#fff}
.big{font-family:"Syne",sans-serif;font-weight:800;font-size:68px;color:#fff;margin-top:18px;letter-spacing:-.01em}
.sub{font-family:"Inter",sans-serif;font-weight:400;font-size:24px;color:#94A3B8;margin-top:14px}
.badge{display:inline-flex;font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:14px;letter-spacing:.06em;color:#22C55E;background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.25);border-radius:100px;padding:8px 20px;margin-top:22px}
#s4-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:99}
#s4-vignette{position:absolute;inset:0;pointer-events:none;z-index:90;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.45) 100%)}
</style>

<div id="root" data-composition-id="s04-la-transformation" data-width="1920" data-height="1080">
  <div id="s4-bg" data-layout-allow-overflow></div>

  <div class="beat" id="b1">
    <div class="card">
      <div class="icon">📝</div>
      <div class="big">12 questions.</div>
      <div class="sub">Cleo analyse ton profil en profondeur.</div>
      <div class="badge">✦ LE TEST</div>
    </div>
  </div>

  <div class="beat" id="b2">
    <div class="card">
      <div class="icon">🎯</div>
      <div class="big">94% de correspondance.</div>
      <div class="sub">Les métiers qui te ressemblent vraiment.</div>
      <div class="badge">✦ TES RÉSULTATS</div>
    </div>
  </div>

  <div class="beat" id="b3">
    <div class="card">
      <div class="icon">🎓</div>
      <div class="big">10 000+ métiers.</div>
      <div class="sub">Formations, salaires, débouchés — tout est là.</div>
      <div class="badge">✦ EXPLORE & FORME-TOI</div>
    </div>
  </div>

  <div class="beat" id="b4">
    <div class="card">
      <div class="icon">🚀</div>
      <div class="big">CV, lettre, offres.</div>
      <div class="sub">Cleo prépare chaque étape pour toi.</div>
      <div class="badge">✦ PASSE À L'ACTION</div>
    </div>
  </div>

  <div id="s4-flash"></div>
  <div id="s4-vignette"></div>
</div>

<script>
window.__timelines = window.__timelines || {};
var tl = gsap.timeline({ paused: true });

gsap.set(".beat", { opacity: 0 });
gsap.set(".card", { scale: .82, y: 24 });
gsap.set("#root", { scale: 1 });

/* continuous slow push across the whole montage — the camera never stops moving */
tl.to("#root", { scale: 1.06, duration: 14, ease: "none" }, 0);
tl.to("#s4-bg", { rotate: 8, duration: 14, ease: "none" }, 0);

var beats = ["#b1", "#b2", "#b3", "#b4"];
var beatDur = 3.5;
beats.forEach(function (sel, i) {
  var t = i * beatDur;
  tl.to("#s4-flash", { opacity: .85, duration: .06, ease: "none" }, t - .06 < 0 ? 0 : t - .06);
  tl.to("#s4-flash", { opacity: 0, duration: .18, ease: "power2.out" }, t);
  tl.to(sel, { opacity: 1, duration: .01 }, t);
  tl.fromTo(sel + " .card", { scale: .82, y: 24 }, { scale: 1, y: 0, duration: .5, ease: "back.out(1.5)" }, t);
  tl.to(sel + " .card", { scale: 1.05, duration: beatDur - .5, ease: "sine.inOut" }, t + .5);
  tl.to(sel, { opacity: 0, duration: .3, ease: "power2.in" }, t + beatDur - .3);
});

window.__timelines["s04-la-transformation"] = tl;
</script>
</template>
</body>
</html>
